version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dartcup-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dartcup
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dartcup-network
    restart: unless-stopped

  # Redis for caching/sessions
  redis:
    image: redis:7-alpine
    container_name: dartcup-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dartcup-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  dartcup-network:
    driver: bridge
